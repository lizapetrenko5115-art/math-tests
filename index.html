<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интерактивные тесты</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:28px 16px 50px;
  font-family:Arial,sans-serif;
  background:#07152f; color:#eef4ff;
}
.wrap{max-width:900px;margin:auto}
.header{
  text-align:center;padding:25px 20px 20px;
  background:#0c2145;border:1px solid #284775;
  border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.35);
  margin-bottom:22px;
}
.math{font-size:54px;line-height:1;margin-bottom:8px}
h1{margin:0 0 8px;font-size:28px}
.subtitle{color:#a9c1e8;font-size:16px}
.tests{display:grid;gap:16px}
.test{
  display:block;text-decoration:none;color:#eef4ff;
  background:#0c2041;border:1px solid #294b7c;
  border-radius:18px;padding:20px;
  box-shadow:0 7px 20px rgba(0,0,0,.25);
  transition:.15s;
}
.test:hover{background:#163664;border-color:#426b9f;transform:translateY(-2px)}
.test-title{font-size:20px;font-weight:bold;margin-bottom:7px}
.test-desc{font-size:14px;color:#a9c2e8;line-height:1.4}
.footer{text-align:center;color:#7895bd;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="math">🧮</div>
    <h1>Интерактивные тесты</h1>
    <div class="subtitle">Теория вероятностей</div>
  </div>

  <div class="tests">
    <a class="test" href="test_protivopolozhnoe_sobytie.html">
      <div class="test-title">🧮 Тест 1 — Противоположное событие</div>
      <div class="test-desc">Повторение понятия противоположного события, формул и задач на вероятность.</div>
    </a>

    <a class="test" href="probability-test.html">
      <div class="test-title">📐 Тест 2 — Повторение теории вероятностей</div>
      <div class="test-desc">Независимые и несовместные события, противоположные события и задачи на вероятность.</div>
    </a>
  </div>

  <div class="footer">Выберите тест</div>
</div>
</body>
</html>
